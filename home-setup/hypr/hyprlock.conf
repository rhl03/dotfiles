# ── Background ──────────────────────────────────────────────────────────────────────
background {
    monitor =
    path = /home/roan/Pictures/Wallpaper/wallpaper.jpg
    blur_size = 6
    blur_passes = 3
    brightness = 0.5
}

# ── Clock ────────────────────────────────────────────────────────────────────────────
label {
    monitor =
    text = $TIME
    color = rgba(c0caf5ff)
    font_size = 72
    font_family = Maple Mono NF Bold
    position = 0, 80
    halign = center
    valign = center
}

# ── Date ─────────────────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(a9b1d6ff)
    font_size = 18
    font_family = Maple Mono NF
    position = 0, 0
    halign = center
    valign = center
}

# ── Password input ───────────────────────────────────────────────────────────────────
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(7aa2f7ff)
    inner_color = rgba(1a1b26ff)
    font_color = rgba(c0caf5ff)
    fade_on_empty = true
    placeholder_text = <span foreground="##565f89">enter password...</span>
    hide_input = false
    check_color = rgba(9ece6aff)
    fail_color = rgba(f7768eff)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(e0af68ff)
    position = 0, -120
    halign = center
    valign = center
}
