########################################################################################
###                                 WINDOW SETTINGS                                  ###
########################################################################################

[window]
padding = { x = 12, y = 12 }
dynamic_padding = true
opacity = 0.9

########################################################################################
###                                   TYPOGRAPHY                                     ###
########################################################################################

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Bold"

########################################################################################
###                                SELECTION & INPUT                                 ###
########################################################################################

[selection]
save_to_clipboard = true

[keyboard]
bindings = [
    { key = "V", mods = "Control", action = "Paste" },
]

########################################################################################
###                                 COLOR SCHEME                                     ###
########################################################################################

# Matches i3 grey theme + blue accent

[colors.primary]
background = '#2e3440'
foreground = '#d8dee9'   # readable light grey

[colors.cursor]
text = '#2e3440'
cursor = '#89b4fa'

[colors.selection]
text = '#2e3440'
background = '#89b4fa'

########################################################################################
###                                NORMAL COLORS                                     ###
########################################################################################

[colors.normal]
black   = '#3b4252'
red     = '#bf616a'
green   = '#a3be8c'
yellow  = '#ebcb8b'
blue    = '#89b4fa'
magenta = '#b48ead'
cyan    = '#88c0d0'
white   = '#e5e9f0'

########################################################################################
###                                BRIGHT COLORS                                     ###
########################################################################################

[colors.bright]
black   = '#4c566a'
red     = '#bf616a'
green   = '#a3be8c'
yellow  = '#ebcb8b'
blue    = '#89b4fa'
magenta = '#b48ead'
cyan    = '#8fbcbb'
white   = '#eceff4'

